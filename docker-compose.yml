version: "3.9"

services:
  rag-api:
    build: .
    container_name: rag-api
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    volumes:
      - ./chroma_data:/app/chroma_data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434  # Connect FastAPI to Ollama container

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama  # Persistent storage for models
    restart: always

volumes:
  ollama_data:
